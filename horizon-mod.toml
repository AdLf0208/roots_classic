id = "rootsclassic"
name = "Roots Classic"
version = "0.2.0"
description = """A port of Roots Classic for Horizon: slice 1, the herbs and their first uses. The three
herb plants, the five berries, the four materials, the three dishes and the pestle, with the jar's
food and effect numbers, its recipes and creative tab, and two behaviours — the global forage
modifier that hides an old root, a verdant sprig, an infernal bulb, a dragon's eye or a berry in a
broken block (1/N chances from config/rootsclassic-common.toml), and the rootsclassic:heal consume
effect. Rituals, standing stones, staves and the Phantom Skeleton are not ported yet."""
authors = ["Elucent", "Lothrazar", "Mrbysco", "AdLf0208"]
# A native mod: Rust in src/, compiled by the launcher against the game build [native] pins,
# beside data/ and assets/. The id is the resource namespace and the only identity: Cargo's
# package name and version are not the mod's.
api = "0.2"
# "both" is the installation side, not the hook's: an integrated server belongs to the client
# installation, so a LAN host or a single-player world needs both. A dedicated server is "server".
side = "both"
# The one shared value every manifest carries ("May add blocks, items, mob effects and entity
# types"), and this port does declare blocks and items in data/, so it is a claim too.
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "0b14f8acfd97fa2c750e42795249dcc981178ca4"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
