[package]
# Port of: Roots Classic 1.21.1-1.5.10 (Lothrazar/RootsClassic, MIT), Minecraft Java 1.21.1
# NeoForge. Clean-room Rust rewrite from the mod's behaviour (FINDINGS.md); local-only until
# publishing is approved (ARCHITECTURE.md §8), publishable under MIT with this source.
#
# Cargo's name and version are not the mod's identity: horizon-mod.toml is.
name = "rootsclassic"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Roots Classic for Horizon: the herbal forage loop and the three herbs (slice 1)"
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod` command (the
# launcher builds against its own copy of the same build). Any other registry dependency must be
# pinned with `horizon-launcher native-lock .` before building.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
